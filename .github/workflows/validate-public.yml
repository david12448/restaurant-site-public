name: Validate restaurant public site
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_public.py
      - run: python scripts/validate_recipes.py
      - run: python scripts/build_public_routes.py
      - run: node --check app.js
      - run: node --check recipes.js
      - run: |
          test -f index.html
          test -f app.js
          test -f styles.css
